name: Patchwork
options:
  bundleIdPrefix: com.swavelycreative.patchwork
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    # The team device builds are signed for. Simulator builds and the tests
    # do not sign, so this costs a contributor without the team nothing
    # until they build for a phone, where they pick their own.
    DEVELOPMENT_TEAM: H886Z8M8DG
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    TARGETED_DEVICE_FAMILY: '1,2'
    # What TestFlight and the App Store read. Bump the build for every
    # upload; the version when what people get changes.
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Patchwork:
    type: application
    platform: iOS
    sources: [Patchwork]
    # Passkeys work only on quilts whose domain this app is associated with,
    # and each listed domain must also list this app (its admin adds the
    # Team ID and bundle id under Administration → Settings → Apps). Every
    # other quilt signs in by emailed code. Keep this list and
    # `PasskeyDomains.all` the same; a unit test checks.
    entitlements:
      path: Patchwork/Patchwork.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:lancasterpatchwork.org
          # Links open here only where the quilt's admin has said so, which
          # adds the paths to the quilt's own association file (Links.swift).
          - applinks:lancasterpatchwork.org
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swavelycreative.patchwork
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The phone layouts are built for portrait. An iPad build must
        # declare every orientation to keep multitasking, so it does, and
        # gets the phone layouts in a wider frame.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # The generated plist is merged onto this one, which carries the one
        # key the INFOPLIST_KEY_* settings have no spelling for: UIAppFonts.
        INFOPLIST_FILE: Patchwork/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Patchwork
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Write-only: the app puts one night a reader chose into their
        # calendar and never reads what else is in it.
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: Patchwork adds an event you choose to your calendar. It never reads your calendar.
  PatchworkTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PatchworkTests]
    dependencies: [{target: Patchwork}]
  PatchworkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PatchworkUITests]
    dependencies: [{target: Patchwork}]
schemes:
  Patchwork:
    build:
      targets:
        Patchwork: all
    # Two plans (README, Testing): Smoke is every unit test and the seven
    # paths that must never break, run on every pull request and by ⌘U;
    # Full is everything, the accessibility audits included, run in
    # parallel on every merge to main and before a release.
    test:
      testPlans:
        - path: Smoke.xctestplan
          defaultPlan: true
        - path: Full.xctestplan
